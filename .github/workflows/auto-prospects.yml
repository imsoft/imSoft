name: Prospectos automáticos (Google Places)

on:
  schedule:
    # Lunes, miércoles y viernes 9:17 UTC (3:17 AM Guadalajara). GitHub retrasa los cron
    # de 4 a 8 horas, sobre todo los de hora en punto: a las 13:00 llegaban a mediodía y la
    # tanda de la mañana salía sin prospectos. Así deberían estar listos antes de las 9 AM.
    - cron: "17 9 * * 1,3,5"
  workflow_dispatch:

jobs:
  find-prospects:
    name: Buscar y dar de alta prospectos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Buscar prospectos
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: node --experimental-strip-types scripts/find-prospects.mjs --max 80
