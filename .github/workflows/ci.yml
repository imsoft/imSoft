name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Tipos, pruebas, lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Comprobar tipos
        run: pnpm exec tsc --noEmit

      - name: Pruebas
        run: pnpm test

      # Does not require zero problems: the repo carries debt from when ESLint was broken.
      # It only fails if the count goes up versus .lint-budget.json.
      - name: Lint (trinquete)
        run: node scripts/lint-budget.mjs

      - name: Build
        # The build prerenders pages from the DB (sitemap, blog, services),
        # so it needs real Supabase credentials. They are the same secrets
        # auto-blog.yml already uses. Verified that these two are enough.
        env:
          NEXT_PUBLIC_SITE_URL: https://www.imsoft.io
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm build
