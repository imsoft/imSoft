name: Auto Blog Publisher

on:
  schedule:
    # Lunes a las 14:00 UTC (8:00 AM hora México). Era diario, pero con 92 articulos
    # sobre ~7 temas el generador ya no tiene angulos nuevos que cubrir a ese ritmo:
    # semanal deja margen para que cada pieza aporte algo distinto.
    - cron: "0 14 * * 1"
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  publish-blog-post:
    name: Generate & Publish Blog Post
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"

      - name: Generate and publish blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLOG_AUTHOR_ID: ${{ secrets.BLOG_AUTHOR_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/generate-blog.mjs
